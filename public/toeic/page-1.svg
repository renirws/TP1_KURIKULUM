<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%" style="background:#ffffff; font-family: 'Times New Roman', Times, serif;">
  <rect width="800" height="1130" fill="#ffffff" />
  
  <!-- Kop Surat -->
  <g id="kop">
    <g transform="translate(55, 25)">
      <circle cx="36" cy="36" r="34" fill="#0284c7" />
      <polygon points="36,8 64,56 8,56" fill="#facc15" stroke="#0369a1" stroke-width="2"/>
